// Logitech Precision (stickless) -- quake-style scheme from the sdlquake port:
// d-pad moves (wired as the move axes in the pad profile), face buttons LOOK,
// shoulders jump/fire, lower pair use/next-weapon, Back = flashlight.
// Exec'd automatically when this pad connects; edit HERE, not in the menus
// (a profile switch re-execs this file). Copy to /media/internal/xash/valve/
// to customize without touching the app install.
bind "X_BUTTON" "+left"
bind "B_BUTTON" "+right"
bind "Y_BUTTON" "+lookup"
bind "A_BUTTON" "+lookdown"
bind "L1_BUTTON" "+jump"
bind "R1_BUTTON" "+attack"
bind "L2_BUTTON" "+use"
bind "R2_BUTTON" "invnext"
bind "BACK" "impulse 100"
bind "START" "cancelselect"
bind "MODE" "toggle touch_enable"
bind "STICK1" "+speed"
bind "STICK2" "+duck"
bind "LTRIGGER" "+use"
bind "RTRIGGER" "invnext"
bind "DPAD_UP" "impulse 201"
bind "DPAD_DOWN" "lastinv"
bind "DPAD_LEFT" "invprev"
bind "DPAD_RIGHT" "invnext"
