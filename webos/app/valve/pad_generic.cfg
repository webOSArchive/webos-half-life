// Unknown/generic pad -- the stock HL gamepad scheme (engine defaults), plus
// the Guide button (if any) toggling the on-screen touch controls.
// Exec'd automatically when this pad connects; edit HERE, not in the menus
// (a profile switch re-execs this file). Copy to /media/internal/xash/valve/
// to customize without touching the app install.
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+use"
bind "X_BUTTON" "+reload"
bind "Y_BUTTON" "impulse 100"
bind "L1_BUTTON" "+duck"
bind "R1_BUTTON" "+attack"
bind "L2_BUTTON" "+speed"
bind "R2_BUTTON" "+attack2"
bind "LTRIGGER" "+speed"
bind "RTRIGGER" "+attack2"
bind "BACK" "pause"
bind "START" "cancelselect"
bind "MODE" "toggle touch_enable"
bind "STICK1" "+speed"
bind "STICK2" "+duck"
bind "DPAD_UP" "impulse 201"
bind "DPAD_DOWN" "lastinv"
bind "DPAD_LEFT" "invprev"
bind "DPAD_RIGHT" "invnext"
